<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Car | TrueDrivve</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">True<span>Drivve</span></div>
</header>

<section class="section">
  <h2>Book Your Car</h2>

  <form onsubmit="sendWhatsApp(); return false;">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="date" id="pickup" required>
    <input type="date" id="drop" required>

    <select id="car">
      <option>Swift</option>
      <option>Baleno</option>
      <option>Creta</option>
      <option>Innova</option>
    </select>

    <input type="text" id="location" placeholder="Pickup Location" required>
    <button type="submit">Book via WhatsApp</button>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
